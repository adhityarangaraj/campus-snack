<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Campus SnackPass</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav aria-label="Main Navigation">
            <a href="index.html" aria-label="Campus SnackPass Home">
                🍽 Campus SnackPass
            </a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main id="main-content">
        <!-- Canteen Header -->
        <section aria-labelledby="canteen-name">
            <h1 id="canteen-name"></h1>
            <p>
                <span id="canteen-status" aria-live="polite"></span>
                <span aria-hidden="true"> | </span>
                <span id="canteen-wait"></span>
                <span aria-hidden="true"> | </span>
                <span id="canteen-count"></span>
            </p>
        </section>

        <!-- Search -->
        <section aria-label="Search Menu">
            <input 
                type="search" 
                id="search-input" 
                placeholder="Search for dosa, noodles, coffee..." 
                aria-label="Search menu items"
            >
        </section>


        <section id="sort-controls" aria-label="Sort Menu">

            <button id="sort-low" class="sort-btn">
                ↑ Price: Low to High
            </button>

            <button id="sort-high" class="sort-btn">
                ↓ Price: High to Low
            </button>

        </section>

        <!-- Categories -->
        <nav id="category-filters" aria-label="Menu Categories">
            <button data-category="all" class="active" aria-pressed="true">All</button>
            <button data-category="breakfast" aria-pressed="false">Breakfast</button>
            <button data-category="lunch" aria-pressed="false">Lunch</button>
            <button data-category="chinese" aria-pressed="false">Chinese</button>
            <button data-category="north-indian" aria-pressed="false">North Indian</button>
            <button data-category="snacks" aria-pressed="false">Snacks</button>
            <button data-category="desserts" aria-pressed="false">Desserts</button>
            <button data-category="beverages" aria-pressed="false">Beverages</button>
        </nav>

        
        <section id="menu-grid" aria-label="Menu Items">
           
        </section>
    </main>

    
    <aside id="floating-cart" aria-label="Floating Cart Summary" hidden>
        <button aria-label="Open cart" id="open-cart-btn">
            <span aria-hidden="true">🛒</span> 
            <span id="floating-cart-count"></span> 
            <span id="floating-cart-total"></span>
        </button>
    </aside>

    
    <aside id="cart-sidebar" aria-labelledby="cart-title" hidden>
        <header>
            <h2 id="cart-title">Your Cart</h2>
            <button id="close-cart-btn" aria-label="Close Cart">✖</button>
        </header>

        <!-- Empty State -->
        <section id="cart-empty-state">
            <span aria-hidden="true">🛒</span>
            <p>Your cart is empty.</p>
            <p>Add something ......</p>
        </section>

        
        <div id="cart-items" aria-label="Cart Items">
           
        </div>

        <!-- Footer -->
        <footer>
            <p>Total Items: <span id="cart-total-items"></span></p>
            <p>Grand Total: <span id="cart-grand-total"></span></p>
            <button id="pin-cart-btn" aria-label="Toggle Pin Cart">📌 Pin Cart</button>
            <button id="checkout-btn">Checkout</button>
        </footer>
    </aside>

    
    <div id="success-modal" hidden>

        <div class="success-card">

            <h2>✅ Order Confirmed</h2>

            <h3 id="token-canteen"></h3>

            <h1 id="token-number"></h1>

            <p>
                <strong>Ordered At:</strong>
                <span id="order-time"></span>
            </p>

            <p>
                <strong>Estimated Wait:</strong>
                <span id="token-wait"></span>
            </p>

            <p>
                Please collect your order when your token number is displayed at the collection counter.
            </p>

            <button id="home-btn">
                Back to Home
            </button>

        </div>

    </div>

    <script type="module" src="menu.js"></script>
</body>
</html>
